[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "infraguard"
version = "0.1.0"
description = "A lightweight infrastructure health auditing CLI"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = ["typer>=0.12,<1.0", "rich>=13.7,<15.0", "psutil>=5.9,<8.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
infraguard = "infraguard.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/infraguard"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
